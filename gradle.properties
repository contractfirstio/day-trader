# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

# Build cache — reuse task outputs across builds
org.gradle.caching=true

# Configuration cache — reuse the configuration phase across builds
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# File system watching — reuse file system snapshots between daemon builds
org.gradle.vfs.watch=true

# Parallel execution — run independent work concurrently (pairs well with caches)
org.gradle.parallel=true
org.gradle.tooling.parallel=true

# E2E/BDD: one test class per JVM fork (see configureE2eTestDefaults in day-trader/build.gradle.kts).
daytrader.e2e.forkEvery=1
# E2E/BDD Gradle Test tasks are chained with mustRunAfter so only one runs at a time per build.
daytrader.e2e.sequentialTasks=true

# Unit tests: Gradle forks (separate JVMs). E2E isolation stays forkEvery=1 per class.
daytrader.unit.maxParallelForks=4
daytrader.unit.forkEvery=25

# Kotlin compiler incremental compilation
kotlin.incremental=true
kotlin.incremental.jvm=true
kotlin.daemon.jvmargs=-Xmx8g

# Kotlin Multiplatform settings
kotlin.mpp.applyDefaultHierarchyTemplate=false

android.useAndroidX=true
android.enableJetifier=true
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
